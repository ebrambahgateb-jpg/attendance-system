<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام تسجيل الحضور</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div id="loginScreen" class="screen active">
    <div class="login-card">
      <div class="logo">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2">
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <path d="M14 14h3v3h-3zM19 19h2v2h-2zM14 19h2v2h-2z"/>
        </svg>
      </div>
      <h1>QR Punch</h1>
      <p class="subtitle">سجّل دخولك لتتبع حضورك</p>

      <button id="googleSignInBtn" class="google-btn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="20" height="20">
        Sign in with Google
      </button>

      <div id="loginMessage" class="message"></div>
    </div>
  </div>

  <!-- شاشة اختيار الدور -->
  <div id="roleScreen" class="screen">
    <div class="role-card">
      <h2>اختر الدور</h2>
      <p class="subtitle">حسابك له أكثر من دور، اختر الدور الذي تريد الدخول به</p>
      <div id="rolesList" class="roles-list"></div>
      <button id="logoutBtn" class="btn-secondary">تسجيل خروج</button>
    </div>
  </div>

  <!-- شاشة رفض الدخول -->
  <div id="deniedScreen" class="screen">
    <div class="denied-card">
      <div class="denied-icon">🚫</div>
      <h2>Access Denied</h2>
      <p id="deniedMessage">الحساب غير موجود في النظام</p>
      <button onclick="location.reload()" class="btn-primary">رجوع</button>
    </div>
  </div>

  <!-- شاشة تعطيل الحساب -->
  <div id="disabledScreen" class="screen">
    <div class="denied-card">
      <div class="denied-icon">⛔</div>
      <h2>Account Disabled</h2>
      <p>حسابك معطل. تواصل مع المسؤول.</p>
      <button onclick="location.reload()" class="btn-primary">رجوع</button>
    </div>
  </div>

  <!-- Firebase SDK + Config -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
