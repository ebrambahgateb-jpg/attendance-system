<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/settings.css" />
</head>
<body class="dashboard-body">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img class="app-logo" src="" alt="Logo" style="display:none;" />
        <span id="appName">Attendance</span>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <!-- يتولد بـ JS -->
    </nav>

    <div class="sidebar-footer">
      <div class="user-box">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-info">
          <div class="user-name" id="userName">-</div>
          <div class="user-role" id="userRole">-</div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()" title="تسجيل خروج">⏻</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main-content">
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h1 id="pageTitle">لوحة التحكم</h1>
      <div class="topbar-right">
        <span class="system-status" id="systemStatus">●</span>
      </div>
    </header>

    <section class="content-area" id="contentArea">
      <!-- المحتوى يتغير هنا -->
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
