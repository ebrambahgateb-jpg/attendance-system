<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/accounts.css" />
  <link rel="stylesheet" href="../css/settings.css" />
  <link rel="stylesheet" href="../css/people.css" />
  <link rel="stylesheet" href="../css/events.css" />
  <link rel="stylesheet" href="../css/event-rsvp.css" />
  <link rel="stylesheet" href="../css/profile.css" />
  <link rel="stylesheet" href="../css/my-attendance.css" />
  <link rel="stylesheet" href="../css/attendance.css" />
  <link rel="stylesheet" href="../css/notifications.css" />
  <link rel="stylesheet" href="../css/workspace-switcher.css" />
  <link rel="stylesheet" href="../css/my-events.css" />
  <link rel="stylesheet" href="../css/schedule.css" />
  <link rel="stylesheet" href="../css/archive.css" />
  <link rel="stylesheet" href="../css/reports.css" />
  <link rel="stylesheet" href="../css/logs.css" />
</head>
<body class="dashboard-body">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img class="app-logo" src="" alt="Logo" style="display:none;" />
        <span id="appName">Attendance</span>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebarNav"></nav>

    <div class="sidebar-footer">
      <div class="user-box">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-info">
          <div class="user-name" id="userName">-</div>
          <div class="user-role" id="userRole">-</div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()" title="تسجيل خروج" aria-label="تسجيل خروج">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main-content">
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h1 id="pageTitle">لوحة التحكم</h1>
      <div class="topbar-right">
        <div id="workspaceSwitcher"></div>
        <button class="notif-bell-btn" id="notificationsBtn" title="الإشعارات" aria-label="الإشعارات">
          🔔
          <span class="notif-badge" id="notificationsBadge" style="display:none;">0</span>
        </button>
        <span class="system-status" id="systemStatus">●</span>
      </div>
    </header>

    <section class="content-area" id="contentArea"></section>
  </main>

  <!-- QRCode Library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <!-- html5-qrcode Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Chart.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Firebase SDK + Modules -->
  <script type="module" src="../js/tabs-config.js"></script>
  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/settings.js"></script>
  <script type="module" src="../js/people.js"></script>
  <script type="module" src="../js/events.js"></script>
  <script type="module" src="../js/event-rsvp.js"></script>
  <script type="module" src="../js/my-events.js"></script>
  <script type="module" src="../js/schedule.js"></script>
  <script type="module" src="../js/archive.js"></script>
  <script type="module" src="../js/reports.js"></script>
  <script type="module" src="../js/logs.js"></script>
  <script type="module" src="../js/profile.js"></script>
  <script type="module" src="../js/my-attendance.js"></script>
  <script type="module" src="../js/attendance.js"></script>
  <script type="module" src="../js/accounts.js"></script>
  <script type="module" src="../js/notifications.js"></script>
  <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
